name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Unit tests carry the checks that matter: BioMatcherTest compares every
      # assignment against the fixture generated from the Python reference, and
      # FastingStyleTest pins the fasting→colour mapping to the seven values the
      # pipeline emits. Both guard defects that shipped once already.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug

      # The debug build never exercises R8. keystore.properties is untracked, so
      # this produces an unsigned APK — enough to catch a minify/resource-shrink
      # regression here rather than in a Play upload.
      - name: Assemble release (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
